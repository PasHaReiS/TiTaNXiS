crons:
  - name: prune-deepl-log
    description: "Deletes deepl_translate_log rows older than 90 days once a day at 03:15 UTC"
    cron: "15 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/prune-deepl-log"
    method: POST
    enabled: true
  - name: weekly-digest-email
    description: "Sends the admin a HTML DeepL usage digest every Monday at 08:00 UTC"
    cron: "0 8 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest-email"
    method: POST
    enabled: true
  - name: telegram-daily-briefing
    description: "Sends a morning briefing to the TiTaNXiS Telegram channel at 08:00 TR (05:00 UTC)"
    cron: "0 5 * * *"
    endpoint: "{{BASE_URL}}/api/cron/telegram-daily-briefing"
    method: POST
    enabled: true
  - name: telegram-weekly-summary
    description: "Sends a weekly summary to the TiTaNXiS Telegram channel every Monday at 08:00 TR (05:00 UTC)"
    cron: "0 5 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/telegram-weekly-summary"
    method: POST
    enabled: true
  - name: purge-vip-trash
    description: "Permanently deletes VIP support tickets that have been in trash for over 24 hours"
    cron: "30 2 * * *"
    endpoint: "{{BASE_URL}}/api/cron/vip-trash-purge"
    method: POST
    enabled: true
  - name: attendance-chase
    description: "DMs members who haven't marked attendance for events 20-24h away. Uses `attendance_chased_at` to skip already-chased events."
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/attendance-chase"
    method: POST
    enabled: true
  - name: telegram-dm-health
    description: "Weekly probe of every stored Telegram chat_id via getChat. Flags dead ids (blocked/deleted) with `dead_since` so DM fan-outs skip them."
    cron: "0 4 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/telegram-dm-health"
    method: POST
    enabled: true
  - name: purge-stale-event-order
    description: "Weekly sweep of per-user event_manual_order — drops ids that no longer point at a live event so the dict stays lean."
    cron: "30 4 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/purge-stale-event-order"
    method: POST
    enabled: true
