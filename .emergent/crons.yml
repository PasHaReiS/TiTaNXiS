crons:
  - name: prune-deepl-log
    description: "Deletes deepl_translate_log rows older than 90 days once a day at 03:15 UTC"
    cron: "15 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/prune-deepl-log"
    method: POST
    enabled: true
  - name: weekly-digest-email
    description: "Sends the admin a HTML DeepL usage digest every Monday at 08:00 UTC"
    cron: "0 8 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest-email"
    method: POST
    enabled: true
  - name: telegram-daily-briefing
    description: "Sends a morning briefing to the TiTaNXiS Telegram channel at 08:00 TR (05:00 UTC)"
    cron: "0 5 * * *"
    endpoint: "{{BASE_URL}}/api/cron/telegram-daily-briefing"
    method: POST
    enabled: true
